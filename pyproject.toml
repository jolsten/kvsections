[project]
name = "kvsections"
dynamic = ["version"]
description = "Read and write fixed-width text files made of named sections of KEY=VALUE pairs."
readme = "README.md"
authors = [
    { name = "Jonathan Olsten", email = "jonathan.olsten@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
keywords = ["parser", "key-value", "sections"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[dependency-groups]
dev = ["mypy", "pytest>=7", "pytest-cov", "ruff"]

[tool.mypy]
files = ["src"]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kvsections"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the git tag (vX.Y.Z); untagged commits build as
# X.Y.Z+1.devN+g<hash>. Nothing in the repository states the version.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/kvsections"]
